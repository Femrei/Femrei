      <circle cx="345" cy="100" r="8" fill="none" class="ring" style="stroke:var(--a)"/>
      <circle cx="345" cy="100" r="8" fill="none" class="ring r2" style="stroke:var(--a)"/>
      <circle cx="345" cy="100" r="4" style="fill:var(--a)"/>
      <text x="420" y="166" font-size="10" text-anchor="end" style="fill:var(--m)">risk · hasar · ihbar</text>
    
<line x1="20" y1="172" x2="420" y2="172" style="stroke:var(--r)"/>
<text x="20" y="190" font-size="10" style="fill:var(--m)">segformer · yolo · berturk · catboost · fastapi</text>
