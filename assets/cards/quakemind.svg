<text x="20" y="72" font-size="12" style="fill:var(--t)">TÜBİTAK 2209-A desteği alan afet</text><text x="20" y="90" font-size="12" style="fill:var(--t)">yönetim platformu: uydudan yol</text><text x="20" y="108" font-size="12" style="fill:var(--t)">hasarı segmentasyonu, YOLO ile bina</text><text x="20" y="126" font-size="12" style="fill:var(--t)">ve çatlak tespiti, BERTurk ile ihbar</text><text x="20" y="144" font-size="12" style="fill:var(--t)">analizi, CatBoost ile risk skoru.</text>

