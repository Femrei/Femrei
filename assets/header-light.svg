<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" role="img" aria-label="Furkan Emre İnce: backend, ML/DL, data science, LLM, RAG ve AI agents">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .t { fill: #1f2328; }
    .m { fill: #656d76; }
    .a { fill: #b45309; }
    .ink { fill: #ffffff; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .box { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.1s .2s cubic-bezier(.6,0,.2,1) forwards; }
    .tag { opacity: 0; animation: fade .3s 1.2s forwards; }
    .row { opacity: 0; animation: fade .4s forwards; }
    .r1 { animation-delay: 1.4s; } .r2 { animation-delay: 1.55s; } .r3 { animation-delay: 1.7s; } .r4 { animation-delay: 1.85s; }
    .curve { fill: none; stroke: #b45309; stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.8s 1.5s ease-out forwards; }
    .end { opacity: 0; animation: fade .3s 3.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .box, .curve { animation: none; stroke-dashoffset: 0; }
      .tag, .row, .end { animation: none; opacity: 1; }
    }
  </style>

  <!-- üst bilgi satırı -->
  <text x="40" y="26" font-size="12" class="m">femrei / profile.spec</text>
  <text x="820" y="26" font-size="12" class="m" text-anchor="end">rev. 2026.11</text>
  <line x1="40" y1="38" x2="820" y2="38" class="rule"/>

  <!-- isim: nesne tespiti kutusu gibi -->
  <g class="tag">
    <rect x="40" y="58" width="138" height="20" class="a"/>
    <text x="48" y="72" font-size="12" font-weight="700" class="ink" textLength="122" lengthAdjust="spacingAndGlyphs">engineer · 0.995</text>
  </g>
  <rect x="40" y="78" width="416" height="58" class="box"/>
  <text x="56" y="120" font-size="38" font-weight="700" class="t" textLength="384" lengthAdjust="spacingAndGlyphs">FURKAN EMRE İNCE</text>

  <!-- spesifikasyon satırları -->
  <g font-size="14">
    <g class="row r1"><text x="40" y="172" class="a">›</text><text x="58" y="172" class="m">rol</text><text x="150" y="172" class="t">Backend &amp; AI Engineer · ML / DL · Data Science</text></g>
    <g class="row r2"><text x="40" y="196" class="a">›</text><text x="58" y="196" class="m">şu an</text><text x="150" y="196" class="t">PAYDA: LLM, RAG ve ajan tabanlı perakende platformu</text></g>
    <g class="row r3"><text x="40" y="220" class="a">›</text><text x="58" y="220" class="m">durum</text><text x="150" y="220" class="t">Bilgisayar Mühendisliği · KTO Karatay Üniversitesi</text></g>
    <g class="row r4"><text x="40" y="244" class="a">›</text><text x="58" y="244" class="m">stack</text><text x="150" y="244" class="t">Python · C# · .NET · PyTorch · LangGraph · AWS</text></g>
  </g>

  <!-- sağda küçük bir eğitim eğrisi -->
  <text x="670" y="148" font-size="11" class="m">val_loss</text>
  <line x1="670" y1="156" x2="670" y2="232" class="rule"/>
  <line x1="670" y1="232" x2="820" y2="232" class="rule"/>
  <polyline class="curve" points="672,160 681,181 690,194 699,201 708,208 717,211 726,216 735,215 744,219 753,221 762,222 771,224 780,223 789,226 798,226 807,227 816,227"/>
  <g class="end">
    <circle cx="816" cy="227" r="3" class="a"/>
    <text x="820" y="250" font-size="11" class="a" text-anchor="end">0.031</text>
    <text x="670" y="250" font-size="11" class="m">epoch →</text>
  </g>
</svg>
