name: metrics

# METRICS_TOKEN: Settings > Developer settings > Personal access tokens ile
# oluşturulan token, bu repo'nun Settings > Secrets > Actions kısmına eklenmeli.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Token'ın değerini değil, yalnızca izin listesini (X-OAuth-Scopes) yazdırır.
      # Gizli repoların dil kartına girmesi için listede "repo" olmalı.
      - name: Token izinleri
        env:
          T: ${{ secrets.METRICS_TOKEN }}
        run: |
          curl -sI -H "Authorization: token $T" https://api.github.com/user | grep -i '^x-oauth-scopes' || echo "izin başlığı okunamadı"

      - name: Diller
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          # Derinlemesine mod: repoların tamamı değil, yalnızca benim commit'lerimde yazdığım
          # satırlar dosya uzantısına göre sayılır.
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 25
          plugin_languages_analysis_timeout_repositories: 10
          # nopCommerce'in hazır kod tabanı (~10 bin dosya) tek commit'le eklendiği için
          # derinlemesine modda bile "benim kodum" sayılıp oranı yutuyor.
          plugin_languages_skipped: nopCommerce-v4.80-Internship-Project
          # Takım projelerinin arayüz dilleri ve işaretleme dilleri sayılmaz.
          plugin_languages_ignored: html, css, scss, typescript, tsx, javascript, jsx, astro, vue, dart, c++, cmake, swift, kotlin, objective-c, batchfile, shell, powershell, dockerfile, procfile, json, yaml, markdown
          plugin_languages_aliases: "jupyter notebook:Notebook"
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_colors: "0:#f0a23b, 1:#c47a1f, 2:#e9973a, 3:#7a4d16, 4:#f8c77e, 5:#7d8590"

# Not: habits ("Cannot destructure property 'author'") ve achievements (Projects classic
# API'si kaldırıldı) eklentileri v3.34'te GitHub API'siyle hata veriyor; eklenmedi.
