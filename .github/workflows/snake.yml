name: katki-yilani

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#b45309&color_dots=#ebedf0,#fde7c7,#f8c77e,#e9973a,#b45309
            dist/snake-dark.svg?palette=github-dark&color_snake=#f0a23b&color_dots=#161b22,#3d2a12,#7a4d16,#c47a1f,#f0a23b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
